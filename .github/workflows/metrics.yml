name: Metrics

on:
  # Régénère les stats toutes les 6 heures
  schedule:
    - cron: "0 */6 * * *"
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Carte principale : commits, repos, étoiles, lignes de code ──────────────
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKE }}
          filename: metrics/overview.svg
          user: Flogss
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          # Compte aussi les contributions dans les repos privés
          repositories_affiliations: owner, collaborator, organization_member
          plugin_traffic: yes

  # ── Calendrier annuel des commits ──────────────────────────────────────────
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKE }}
          filename: metrics/calendar.svg
          user: Flogss
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ── Rythme de commit : total, par heure, par jour de semaine ───────────────
  # Le plugin `habits` de metrics est inutilisable : il lit l'API Events, qui
  # n'expose plus `payload.commits` (il plante sur "Cannot destructure property
  # 'author' of 'undefined'"). Ce script interroge GraphQL à la place.
  rhythm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate commit rhythm card
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKE }}
          GH_LOGIN: Flogss
          TZ_OFFSET: "2"
          OUT: metrics/rhythm.svg
        run: python3 scripts/commit_rhythm.py
      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/rhythm.svg
          git diff --quiet --cached || git commit -m "Update metrics/rhythm.svg - [Skip GitHub Action]"
          git push

  # ── Répartition des langages (sur les commits réels, pas la taille repo) ───
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKE }}
          filename: metrics/languages.svg
          user: Flogss
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
